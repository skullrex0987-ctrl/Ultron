[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-agent"
version = "0.1.0"
description = "ULTRON laptop and phone agent"
requires-python = ">=3.11"

[project.optional-dependencies]
laptop = ["websockets>=12", "numpy", "sounddevice", "vosk", "pillow", "pytesseract"]
phone = ["websockets>=12", "vosk"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
