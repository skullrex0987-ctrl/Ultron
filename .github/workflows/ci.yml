name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m compileall -q laptop phone tests
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Reject generated artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(__pycache__/|.*\.pyc$|.*audit\.jsonl$)'; then
            echo 'Generated runtime artifacts are tracked.'
            exit 1
          fi
      - name: Secret scan
        shell: bash
        run: |
          if git grep -n -I -E 'github_pat_|ghp_|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}' -- ':!.github/workflows/ci.yml'; then
            echo 'Potential secret detected.'
            exit 1
          fi

  hud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hud/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
